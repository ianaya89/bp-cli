name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag must match pyproject version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "tag=$TAG  pyproject=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag v$TAG does not match pyproject version $VER — bump pyproject and re-tag"
            exit 1
          fi

      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # ── Optional: publish to PyPI ──────────────────────────────────────────────
  # Enable by (1) creating the project on PyPI, (2) adding a Trusted Publisher
  # for this repo + workflow (pypi.org → project → Publishing), and (3) adding a
  # GitHub Environment named `pypi`. Then uncomment:
  #
  # pypi:
  #   needs: release
  #   runs-on: ubuntu-latest
  #   environment: pypi
  #   permissions:
  #     id-token: write   # trusted publishing, no token needed
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-python@v5
  #       with:
  #         python-version: "3.12"
  #     - run: pip install build && python -m build
  #     - uses: pypa/gh-action-pypi-publish@release/v1
