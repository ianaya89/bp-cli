name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e .
      - name: Smoke test (isolated HOME, no BLE)
        env:
          HOME: ${{ runner.temp }}
        run: |
          obp --help
          obp tags add demo
          obp add 120 80 --pulse 70 --tag demo
          obp add 132 86 --timestamp "2026-01-01 08:00"
          obp list --days 0
          obp list --days 0 --tag demo
          obp stats
          obp tags rm demo

  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - name: Validate metadata + that static assets are bundled
        run: |
          twine check dist/*
          python - <<'PY'
          import glob, zipfile, sys
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          need = ["omron_bp/static/tailwind.js", "omron_bp/static/chart.js"]
          missing = [n for n in need if n not in names]
          sys.exit("missing from wheel: " + ", ".join(missing) if missing else 0)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
