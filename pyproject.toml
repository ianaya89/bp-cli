[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omron-bp"
version = "0.1.0"
description = "CLI + local web UI to sync, browse, tag and report Omron BLE blood-pressure monitors"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ignacio Anaya" }]
keywords = ["omron", "blood-pressure", "ble", "bluetooth", "health", "cli"]
dependencies = [
    "bleak>=0.22.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "plotext>=5.2.0",
    "reportlab>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/ianaya89/omron-bp"

[project.scripts]
obp = "omron_bp.bp:app"

[tool.setuptools]
packages = ["omron_bp"]

[tool.setuptools.package-data]
omron_bp = ["static/*"]
